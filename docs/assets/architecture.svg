<svg xmlns="http://www.w3.org/2000/svg" width="880" height="685" viewBox="0 0 880 685"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><rect width="880" height="685" rx="20" fill="#f8fafc"/><text x="32" y="42" font-family="sans-serif" font-size="25" font-weight="700" fill="#0f172a">SCARA system architecture</text><text x="32" y="70" font-family="sans-serif" font-size="14" fill="#475569">PC planning and sequencing • Arduino execution • open-loop actuation</text><path d="M440 202V223H228V245" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M440 223H652V245" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M228 341V365H440V385" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M440 487V510H157V535" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M440 510V535" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M440 510H723V535" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="100" width="816" height="102" rx="12" fill="#e0f2fe" stroke="#94a3b8"/><text x="48" y="128" font-family="sans-serif" font-size="17" font-weight="700" fill="#0f172a">Python controller</text><text x="48" y="154" font-family="sans-serif" font-size="14" fill="#334155">Floor plan / editor → kinematics and reachability → pick-and-place sequence</text><text x="48" y="176" font-family="sans-serif" font-size="14" fill="#334155">Geometry, joint settings and serial configuration are robot-specific.</text><rect x="32" y="245" width="392" height="96" rx="12" fill="#e0f2fe" stroke="#94a3b8"/><text x="48" y="273" font-family="sans-serif" font-size="17" font-weight="700" fill="#0f172a">Hardware serial interface</text><text x="48" y="299" font-family="sans-serif" font-size="14" fill="#334155">Newline-delimited commands at 115200 baud</text><text x="48" y="321" font-family="sans-serif" font-size="14" fill="#334155">Controller responses return to the host.</text><rect x="456" y="245" width="392" height="96" rx="12" fill="#dcfce7" stroke="#94a3b8"/><text x="472" y="273" font-family="sans-serif" font-size="17" font-weight="700" fill="#0f172a">DryRunSerial</text><text x="472" y="299" font-family="sans-serif" font-size="14" fill="#334155">Synthetic command acknowledgements</text><text x="472" y="321" font-family="sans-serif" font-size="14" fill="#334155">Offline rehearsal; no physical simulation.</text><rect x="32" y="385" width="816" height="102" rx="12" fill="#e0f2fe" stroke="#94a3b8"/><text x="48" y="413" font-family="sans-serif" font-size="17" font-weight="700" fill="#0f172a">Arduino Mega 2560</text><text x="48" y="439" font-family="sans-serif" font-size="14" fill="#334155">Command parsing and target-range checks • homing • gripper control</text><text x="48" y="461" font-family="sans-serif" font-size="14" fill="#334155">Joint settings stored together in JOINTS[].</text><rect x="32" y="535" width="250" height="112" rx="12" fill="#e0f2fe" stroke="#94a3b8"/><text x="48" y="563" font-family="sans-serif" font-size="17" font-weight="700" fill="#0f172a">Rotational axes</text><text x="48" y="589" font-family="sans-serif" font-size="14" fill="#334155">J1, J2, J3: Timer 5</text><text x="48" y="611" font-family="sans-serif" font-size="14" fill="#334155">Ramped speed profile</text><text x="48" y="633" font-family="sans-serif" font-size="14" fill="#334155">Bresenham pulse distribution</text><rect x="315" y="535" width="250" height="112" rx="12" fill="#e0f2fe" stroke="#94a3b8"/><text x="331" y="563" font-family="sans-serif" font-size="17" font-weight="700" fill="#0f172a">Vertical axis</text><text x="331" y="589" font-family="sans-serif" font-size="14" fill="#334155">Blocking Z movement</text><text x="331" y="611" font-family="sans-serif" font-size="14" fill="#334155">Runs after rotational move</text><text x="331" y="633" font-family="sans-serif" font-size="14" fill="#334155">Polled limit input for homing</text><rect x="598" y="535" width="250" height="112" rx="12" fill="#dcfce7" stroke="#94a3b8"/><text x="614" y="563" font-family="sans-serif" font-size="17" font-weight="700" fill="#0f172a">Gripper</text><text x="614" y="589" font-family="sans-serif" font-size="14" fill="#334155">Manual pulses during sweep</text><text x="614" y="611" font-family="sans-serif" font-size="14" fill="#334155">Timer 4 holds position</text><text x="614" y="633" font-family="sans-serif" font-size="14" fill="#334155">SG90 servo</text></svg>