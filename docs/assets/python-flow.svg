<svg xmlns="http://www.w3.org/2000/svg" width="584" height="767" viewBox="0 0 584 767"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><rect width="584" height="767" rx="20" fill="#f8fafc"/><text x="32" y="42" font-family="sans-serif" font-size="25" font-weight="700" fill="#0f172a">From floor plan to block placement</text><text x="32" y="70" font-family="sans-serif" font-size="14" fill="#475569">Current host workflow • validation happens before serial connection</text><path d="M292 195V230" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M292 325V360" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M292 455V490" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M292 585V620" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="100" width="520" height="95" rx="12" fill="#e0f2fe" stroke="#94a3b8"/><text x="48" y="128" font-family="sans-serif" font-size="17" font-weight="700" fill="#0f172a">1  Select a layout</text><text x="48" y="154" font-family="sans-serif" font-size="14" fill="#334155">Load a space-separated floor plan</text><text x="48" y="176" font-family="sans-serif" font-size="14" fill="#334155">or choose a preset in the interactive editor.</text><rect x="32" y="230" width="520" height="95" rx="12" fill="#e0f2fe" stroke="#94a3b8"/><text x="48" y="258" font-family="sans-serif" font-size="17" font-weight="700" fill="#0f172a">2  Validate target positions</text><text x="48" y="284" font-family="sans-serif" font-size="14" fill="#334155">Compute kinematics and check reachability.</text><text x="48" y="306" font-family="sans-serif" font-size="14" fill="#334155">Reject invalid layouts before connecting.</text><rect x="32" y="360" width="520" height="95" rx="12" fill="#e0f2fe" stroke="#94a3b8"/><text x="48" y="388" font-family="sans-serif" font-size="17" font-weight="700" fill="#0f172a">3  Select the serial interface</text><text x="48" y="414" font-family="sans-serif" font-size="14" fill="#334155">Hardware: connect to the controller.</text><text x="48" y="436" font-family="sans-serif" font-size="14" fill="#334155">Dry run: use simulated acknowledgements.</text><rect x="32" y="490" width="520" height="95" rx="12" fill="#e0f2fe" stroke="#94a3b8"/><text x="48" y="518" font-family="sans-serif" font-size="17" font-weight="700" fill="#0f172a">4  Home and sequence layers</text><text x="48" y="544" font-family="sans-serif" font-size="14" fill="#334155">HOME before building; REHOME_Z for layer two.</text><text x="48" y="566" font-family="sans-serif" font-size="14" fill="#334155">Run selected positions in their supplied order.</text><rect x="32" y="620" width="520" height="115" rx="12" fill="#dcfce7" stroke="#94a3b8"/><text x="48" y="648" font-family="sans-serif" font-size="17" font-weight="700" fill="#0f172a">5  Execute each pick-and-place</text><text x="48" y="674" font-family="sans-serif" font-size="14" fill="#334155">Approach → descend → grasp → lift</text><text x="48" y="696" font-family="sans-serif" font-size="14" fill="#334155">Transfer → descend → release → retract</text><text x="48" y="718" font-family="sans-serif" font-size="14" fill="#334155">Check responses during the placement sequence.</text></svg>